name: Security rule conformance
on:
  pull_request:
    paths:
      - "security/**"
      - ".github/workflows/security-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: security
        run: python -m pip install -r requirements.txt
      - name: Run security conformance tests
        working-directory: security
        run: python -m pytest -q
# IMPORTANT: This path assumes the kit lives in monorepo /security.
# Update workflow paths if you use the kit as a standalone repository.
# Add Semgrep/Trivy/Checkov as separate reviewed CI jobs later.
