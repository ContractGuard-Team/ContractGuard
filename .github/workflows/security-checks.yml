name: ContractGuard checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-and-python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Check JSON Schemas
        run: python scripts/check_schemas.py
      - name: Compile Python sources
        run: python -m compileall -q security worker scripts
