name: "CI: Security & Schemas"

on:
  push:
    branches: [main]
    paths:
      - "security/**"
      - "contracts/**"
      - "worker/**"
      - "scripts/**"
      - ".github/workflows/ci-security.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Check JSON Schemas
        run: python scripts/check_schemas.py
      - name: Compile Python sources
        run: python -m compileall -q security worker scripts

  security-rule-tests:
    name: Validate security rule fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install security test dependencies
        run: python -m pip install -r security/requirements.txt

      - name: Run security conformance tests
        working-directory: security
        run: python -m pytest -q
