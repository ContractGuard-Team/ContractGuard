name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if the two disagree.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # The web image serves what the build makes. nginx does not know .mjs by itself, and browsers
      # refuse a PDF.js worker sent as a plain file, which breaks the viewer without failing a test.
      - name: Web image serves the PDF.js worker as a script
        run: |
          docker build -t contractguard-web .
          docker run -d --rm --name contractguard-web -p 18080:8080 contractguard-web
          worker=$(docker exec contractguard-web sh -c 'ls /usr/share/nginx/html/assets | grep "^pdf.worker"')
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsSI "http://localhost:18080/assets/$worker" | grep -i '^content-type: text/javascript'
          docker stop contractguard-web
