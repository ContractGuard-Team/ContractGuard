name: contractguard

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: contractguard
      POSTGRES_USER: contractguard
      POSTGRES_PASSWORD: contractguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U contractguard -d contractguard" ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.4
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env}
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-southeast-1
    ports:
      - "4566:4566"
    volumes:
      # shortcut: the free plan keeps nothing across a restart, so uploaded files are lost while the
      # database keeps their records. Run `down -v` to clear both. S3 on AWS does not have this limit.
      - ./infra/local/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import json, sys, urllib.request as u
          r = json.load(u.urlopen("http://localhost:4566/_localstack/init/ready", timeout=2))
          ok = r["completed"] and all(s["state"] == "SUCCESSFUL" for s in r["scripts"])
          sys.exit(0 if ok else 1)
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      # Change them in .env when another project on this machine already uses these ports.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # ---- Profile "app": the API and the web app in containers ------------------------------
  # Not started by a plain `docker compose up`, so `dotnet run` and `npm run dev` keep working
  # during development. Start everything with: docker compose --profile app up -d --build
  # Then open http://localhost:5173

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      # The bundle builds the DbContext through the API's own configuration (like `dotnet ef`),
      # so it reads the connection string from the same setting as the API.
      Database__ConnectionString: Host=postgres;Port=5432;Database=contractguard;Username=contractguard;Password=contractguard
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network services reach each other by service name, not localhost.
      Database__ConnectionString: Host=postgres;Port=5432;Database=contractguard;Username=contractguard;Password=contractguard
      Aws__ServiceUrl: http://localstack:4566
      # Presigned URLs are opened by the browser on the host, which knows only localhost.
      Aws__PublicServiceUrl: http://localhost:4566
      Email__SmtpHost: mailpit
      # No AI worker yet: contracts and contexts are saved, no analysis starts. To test with
      # scripts/dev/send-analysis-result.ps1, set ANALYSIS_WORKER_ENABLED=true.
      Analysis__WorkerEnabled: ${ANALYSIS_WORKER_ENABLED:-false}
      # No chat model yet: the chat says it is not connected. CHAT_RESPONDER=fake streams a fixed,
      # clearly labelled answer to test the chat path (e2e); never set it on a demo.
      Chat__Responder: ${CHAT_RESPONDER:-}
      # Google sign-in (F-AUTH-002). Empty: the button says Google sign-in is not enabled.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl; bash can open a TCP socket through /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    profiles: [app]
    build:
      context: ./frontend
    ports:
      # Same port as `npm run dev`: the bucket's CORS rule and the links in emails point to it.
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
