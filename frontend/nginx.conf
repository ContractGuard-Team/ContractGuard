# Same origin for the browser, like CloudFront in front of S3 and the ALB (SD-03),
# so the session cookie works without CORS. Used locally (compose) and on Railway staging (docs/04 C6).
# A template: the image fills ${API_UPSTREAM} and ${NGINX_LOCAL_RESOLVERS} (the container's own DNS:
# Docker's on compose, the private network's on Railway) when it starts. nginx's own $variables stay.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        # Read through a variable: nginx looks the name up on each request, so it keeps working
        # when the API is redeployed with a new address.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $api ${API_UPSTREAM};
        proxy_pass $api;
        # $http_host keeps the port (:5173); the Google handler builds its redirect_uri from it.
        proxy_set_header Host $http_host;
        # Passed on as it came: Railway's edge already sends "client, edge", the same shape the ALB sends on
        # AWS, and the API takes the client two hops back (Program.cs). Appending nginx's own peer would
        # make that the edge. Locally there is no such header and the API sees the nginx container.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # Railway's edge ends TLS and says so here; the API needs it for its Secure cookies.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The PDF.js worker. nginx does not know .mjs, and browsers refuse a module without a script type.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # Built files carry a content hash in their name: a new build gets new names, so they never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app is one index.html that routes in the browser, so /contracts/123 must not be a 404.
    # no-cache: the browser asks again each time (cheap, ETag), so after a deploy it never keeps an old
    # index.html that loads the previous build's code against the new API.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
