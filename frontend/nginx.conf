# Same origin for the browser, like CloudFront in front of S3 and the ALB (SD-03),
# so the session cookie works without CORS.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        # Docker's DNS, read through a variable: nginx looks the name up on each request,
        # so it keeps working when the api container is recreated with a new IP.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The PDF.js worker. nginx does not know .mjs, and browsers refuse a module without a script type.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # The app is one index.html that routes in the browser, so /contracts/123 must not be a 404.
    location / {
        try_files $uri /index.html;
    }
}
